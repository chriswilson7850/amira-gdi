<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF3D7"/>
      <stop offset="0.5" stop-color="#F9E6AE"/>
      <stop offset="1" stop-color="#F1D488"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE394"/>
      <stop offset="0.5" stop-color="#F5C24C"/>
      <stop offset="1" stop-color="#D99E2B"/>
    </linearGradient>
    <linearGradient id="golddark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C98B1F"/>
      <stop offset="1" stop-color="#8A5E10"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="700" rx="250" ry="34" fill="url(#shadow)" filter="url(#blur)"/>

  <text x="400" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="8" fill="#7a5510" font-weight="bold">AMIRA GOLD</text>

  <!-- Necklace chain -->
  <path d="M 180 300 A 220 220 0 0 1 620 300" fill="none" stroke="url(#golddark)" stroke-width="11" stroke-linecap="round"/>
  <path d="M 180 300 A 220 220 0 0 1 620 300" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 15"/>

  <!-- Pendant -->
  <path d="M 400 302 L 400 382" stroke="url(#golddark)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="400" cy="436" r="54" fill="url(#gold)" stroke="url(#golddark)" stroke-width="4"/>
  <circle cx="400" cy="436" r="30" fill="none" stroke="#7a5510" stroke-opacity="0.5" stroke-width="2"/>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#5a3d00">AG</text>

  <text x="400" y="612" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="6" fill="#7a5510">GOLD NECKLACE</text>
  <text x="400" y="652" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="4" fill="#8a6410">FINE GOLD JEWELRY</text>
</svg>
